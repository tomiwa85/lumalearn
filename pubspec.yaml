name: lumalearn
description: AI-guided learning application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
              flutter:
                sdk: flutter

  # --- Architecture & State ---
              flutter_riverpod: ^2.5.1
              riverpod_annotation: ^2.3.5
              go_router: ^14.0.0  # [cite: 13]

  # --- Backend ---
              supabase_flutter: ^2.6.0 # [cite: 14, 60]

  # --- UI & Utilities ---
              google_fonts: ^6.2.1
              flutter_markdown: ^0.7.1 # For rendering AI hints [cite: 13]
              flutter_svg: ^2.0.10
              glassmorphism: ^3.0.0 # To achieve the glass effect in the design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/